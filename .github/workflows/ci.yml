name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-tests:
    name: static-tests
    runs-on: [self-hosted, Linux, ARM64, org-pool]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: npm ci
      - name: Run vitest
        run: npm test

  version-consistency:
    name: version-consistency
    uses: ./.github/workflows/version-consistency.yml
